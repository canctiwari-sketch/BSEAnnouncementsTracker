name: Relative Strength

on:
  schedule:
    - cron: '30 12 * * 1-5'   # Weekdays 18:00 IST (12:30 UTC), after market close + bhavcopy publish
  workflow_dispatch:

concurrency:
  group: rel-strength
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relstrength:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3 "httpx[http2]==0.28.1" openpyxl==3.1.2

      - name: Build relative strength data
        run: python worker/rel_strength.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rel_strength.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Rel strength: $(date +'%Y-%m-%d')"
            pushed=false
            for i in 1 2 3; do
              if git push; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push after 3 attempts — this run's data was NOT saved."
              exit 1
            fi
          fi
