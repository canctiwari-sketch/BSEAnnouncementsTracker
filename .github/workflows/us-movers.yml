name: US Movers

on:
  schedule:
    - cron: '0 2 * * 2-6'   # Tue-Sat 07:30 IST — after the prior US session closes
  workflow_dispatch:

concurrency:
  group: us-movers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  usmovers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Build US movers data
        run: python worker/us_movers.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_movers.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "US movers: $(date +'%Y-%m-%d')"
            pushed=false
            for i in 1 2 3; do
              if git push; then pushed=true; break; fi
              git rebase --abort 2>/dev/null || true
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push after 3 attempts — this run's data was NOT saved."
              exit 1
            fi
          fi
