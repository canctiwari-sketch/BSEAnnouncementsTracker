name: Management Interviews

on:
  schedule:
    - cron: '0 4 * * *'   # 9:30 AM IST daily (04:00 UTC)
  workflow_dispatch:

concurrency:
  group: interviews
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3

      - name: Fetch interviews
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python worker/interviews.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interviews.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Interviews: $(date +'%Y-%m-%d')"
            pushed=false
            for i in 1 2 3; do
              if git push; then
                echo "Push OK on attempt $i"
                pushed=true
                break
              fi
              echo "Retry $i"
              git rebase --abort 2>/dev/null || true
              git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
              sleep 3
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Failed to push after 3 attempts — this run's data was NOT saved."
              exit 1
            fi
          fi
